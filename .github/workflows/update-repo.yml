name: Update Repository

on:
  schedule: # run 15 mins after jlcpcb kicad library's own daily build
    - cron: "15 6 * * *"
  workflow_dispatch: # allow manually triggering the workflow

jobs:
  update-library-from-database:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push
      # the added or changed files back to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python updateRepository.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Apply automatic changes"
